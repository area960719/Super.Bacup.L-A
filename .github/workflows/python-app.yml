# .github/workflows/python-app.yml
name: Compilar SuperBackup y subir ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (si las tienes)
        run: |
          python -m pip install --upgrade pip
          # Si tienes un requirements.txt, descomenta la línea de abajo:
          # pip install -r requirements.txt

      - name: Empaquetar todo en un ZIP
        run: |
          zip -r SuperBackup.zip . -x "*.git*" -x "*.github*"

      - name: Subir el ZIP como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SuperBackup-${{ github.sha }}
          path: SuperBackup.zip
          retention-days: 30
